model:
  base_model: ../Qwen3-1.7B
  train_from_scratch: false
data:
  train_file: ./data_experiment/Amazon/collab_ranking_local_multihop_mid/train/Industrial_and_Scientific_5_2016-10-2018-11.csv
  eval_file: ./data_experiment/Amazon/collab_ranking_local_multihop_mid/valid/Industrial_and_Scientific_5_2016-10-2018-11.csv
  sid_index_path: ./data_experiment/Amazon/collab_ranking_local_multihop_mid/index/Industrial_and_Scientific.index.json
  item_meta_path: ./data_experiment/Amazon/collab_ranking_local_multihop_mid/index/Industrial_and_Scientific.item.json
  category: Industrial_and_Scientific
training:
  batch_size: 1024
  micro_batch_size: 2
  cutoff_len: 512
  enable_title_history2sid_dataset: false
  enable_title_description_alignment: true
  description_task_probability: 0.5
  num_epochs: 10
  learning_rate: 0.0003
  seed: 42
  freeze_llm: false
  group_by_length: false
  warmup_steps: 20
  load_best_model_at_end: true
  early_stopping_patience: 3
  eval_step: 0.05
logging:
  wandb_project: OneRec
  wandb_run_name: sft_mgr_collab_ranking_local_multihop_mid_title_off_desc_p05_industrial
  report_to: wandb
output:
  output_dir: /data/leejt/OneRec/output_weights/experiments/mgr_sid_collab_ranking_local_multihop_mid_sft_eval_20260419/title_off_desc_p05/sft
  save_total_limit: 2
runtime:
  launcher: torchrun
  cuda_visible_devices: "2,3,4,5"
  nproc_per_node: 4
