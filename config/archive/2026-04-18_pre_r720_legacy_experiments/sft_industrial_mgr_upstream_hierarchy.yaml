model:
  base_model: ../Qwen3-1.7B
  train_from_scratch: false
data:
  train_file: ./data_experiment/Amazon/mgr_upstream_hierarchy/train/Industrial_and_Scientific_5_2016-10-2018-11.csv
  eval_file: ./data_experiment/Amazon/mgr_upstream_hierarchy/valid/Industrial_and_Scientific_5_2016-10-2018-11.csv
  sid_index_path: ./data_experiment/Amazon/mgr_upstream_hierarchy/index/Industrial_and_Scientific.index.json
  item_meta_path: ./data_experiment/Amazon/mgr_upstream_hierarchy/index/Industrial_and_Scientific.item.json
  category: Industrial_and_Scientific
training:
  batch_size: 1024
  micro_batch_size: 2
  cutoff_len: 512
  enable_title_history2sid_dataset: true
  enable_title_description_alignment: false
  description_task_probability: 0.5
  num_epochs: 10
  learning_rate: 0.0003
  seed: 42
  freeze_llm: false
  group_by_length: false
  warmup_steps: 20
  load_best_model_at_end: true
  early_stopping_patience: 3
  eval_step: 0.05
logging:
  wandb_project: OneRec
  wandb_run_name: sft_mgr_upstream_hierarchy_industrial
  report_to: wandb
output:
  output_dir: ./output/experiments/mgr_sid_sft_eval_industrial_20260410/mgr_upstream_hierarchy/sft
  save_total_limit: 2
runtime:
  launcher: torchrun
  cuda_visible_devices: "4,5"
  nproc_per_node: 2
